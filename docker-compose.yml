version: "3.8"
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      KUNJ_ENV: development
      KUNJ_DATABASE_URL: postgresql://kunj:kunj@postgres:5432/kunj
      KUNJ_REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    command: celery -A tasks worker -l info
    environment:
      KUNJ_DATABASE_URL: postgresql://kunj:kunj@postgres:5432/kunj
      KUNJ_REDIS_URL: redis://redis:6379/0
      KUNJ_CELERY_BROKER_URL: redis://redis:6379/0
      KUNJ_CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kunj
      POSTGRES_PASSWORD: kunj
      POSTGRES_DB: kunj
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_preload_libraries=vector"]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  langfuse:
    image: langfuse/langfuse:latest
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://kunj:kunj@postgres:5432/kunj
      NEXTAUTH_SECRET: change-me-secret
    depends_on:
      - postgres

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  tempo:
    image: grafana/tempo:latest
    ports:
      - "4317:4317"
      - "3200:3200"

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"

volumes:
  pgdata:
  grafana-data: